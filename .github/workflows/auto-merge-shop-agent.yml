name: Merge shop system promotions
# The shop's WhatsApp system (shop-agent, shop id sst) opens a pull request when the shop manager has confirmed
# a promotion in chat, or when one ends. This workflow merges that pull request by itself, and only if ALL hold:
#   1. the pull request comes from a branch inside this repository named shop-agent/promotions-*
#   2. it changes exactly one file, data/promotions.json (modified, not added, renamed or deleted)
#   3. `npm run check` passes on the merged result (services + promotions validation, build, site checks)
# Anything else stays open for a person. Uses the built-in GITHUB_TOKEN only.
#
# pull_request_target is deliberate: the workflow definition always comes from main, so a pull request cannot
# edit this file to skip a check. The pull request's own code is never trusted: rule 2 means it can only change
# a JSON data file, and the scripts that read that file are the ones on main.
#
# A merge made with GITHUB_TOKEN does not start other workflows, so the last step starts pages.yml by
# workflow_dispatch (the one event GITHUB_TOKEN may trigger). If main has a branch protection rule that needs
# a review, the merge step fails and the pull request waits for a person; the offer is then not on the site.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

concurrency:
  group: shop-agent-merge
  cancel-in-progress: false

permissions: {}

jobs:
  merge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'shop-agent/promotions-') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # merge the pull request, delete its branch
      pull-requests: write   # merge, comment
      actions: write         # start pages.yml
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Rule 2, only data/promotions.json changes
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | [.status, .filename] | @tsv')
          printf 'Changed files:\n%s\n' "$files"
          want=$(printf 'modified\tdata/promotions.json')
          if [ "$files" != "$want" ]; then
            echo "::error::this pull request must change exactly data/promotions.json and nothing else"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2   # the merge commit and both parents, so HEAD^2 can be compared
          persist-credentials: false

      - name: The checked tree is the head that will be merged
        run: |
          test "$(git rev-parse HEAD^2)" = "$SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Rule 3, npm run check
        run: npm run check

      - name: Merge (squash, only if the head is still the one that was checked)
        run: gh pr merge "$PR" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA"

      - name: Publish the site (a GITHUB_TOKEN merge does not trigger pages.yml)
        run: gh workflow run pages.yml --repo "$REPO" --ref main

      - name: Say so on the pull request if anything above failed
        if: failure()
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "Automatic merge did not happen, so this offer change is not on the site. See $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID. A person needs to look."
