name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  # auto-merge-shop-agent.yml starts this by hand after a merge (a GITHUB_TOKEN merge does not fire `push`).
  workflow_dispatch:
  # Offers end at midnight London. Rebuild just after it (23:10 UTC in summer, 00:10 UTC in winter) so an ended
  # offer leaves the HTML too; the browser already hides it from the first second.
  schedule:
    - cron: "10 23 * * *"
    - cron: "10 0 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # A broken edit of data/services.json stops here and the live site stays as it was.
      - name: Validate services.json
        run: node scripts/validate-services.mjs
      # A bad offer written by the shop system stops here and the live site stays as it was.
      - name: Validate promotions.json
        run: node scripts/validate-promotions.mjs
      - name: Build
        run: npx --no-install next build
      - name: Check output
        run: node scripts/check-site.mjs
      # Old Wix URLs keep working after the shop's domain moves here: stubs go into out/
      # after the build, so they never enter the sitemap.
      - name: Redirect stubs for old Wix URLs
        run: node scripts/build-redirect-stubs.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
